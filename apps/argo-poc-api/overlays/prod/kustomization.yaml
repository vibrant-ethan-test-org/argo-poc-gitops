# prod environment. The image tag and app-sha below are what CI and promotion change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-poc-api-prod
resources:
- ../../base
images:
- name: ghcr.io/vibrant-ethan-test-org/argo-poc-api
  newTag: v0.2.9
commonAnnotations:
  argo-poc/app-sha: 616ebe4665bfcf52e4ea29b928a9d7455234b0b6
patches:
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30191
  target:
    kind: Service
    name: app-active
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30192
  target:
    kind: Service
    name: app-preview
