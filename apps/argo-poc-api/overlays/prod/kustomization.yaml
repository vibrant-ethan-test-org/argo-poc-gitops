# prod environment. The image tag and app-sha below are what CI and promotion change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-poc-api-prod
resources:
- ../../base
images:
- name: ghcr.io/vibrant-ethan-test-org/argo-poc-api
  newTag: v0.1.1
commonAnnotations:
  argo-poc/app-sha: 042df5c623e06731f9243167b2965af0d4c89186
patches:
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30191
  target:
    kind: Service
    name: app-active
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30192
  target:
    kind: Service
    name: app-preview
