apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: app
spec:
  replicas: 2
  revisionHistoryLimit: 3
  # A release whose pods never become ready is aborted after 3 minutes.
  progressDeadlineSeconds: 180
  progressDeadlineAbort: true
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-poc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argo-poc
    spec:
      containers:
        - name: app
          image: ghcr.io/vibrant-ethan-test-org/argo-poc-app # tag set by overlays
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
  strategy:
    blueGreen:
      activeService: app-active   # live traffic (blue)
      previewService: app-preview # new version under test (green)
      autoPromotionEnabled: true  # switch as soon as e2e passes
      scaleDownDelaySeconds: 30   # keep the old version briefly for fast rollback
      prePromotionAnalysis:
        templates:
          - templateName: e2e
        args:
          - name: target-url
            value: http://app-preview
          - name: expected-sha
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['argo-poc/app-sha']
