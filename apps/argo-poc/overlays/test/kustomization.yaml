# test environment. The image tags and app-sha below are what CI and promotion change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-test
resources:
- ../../base
images:
- name: ghcr.io/vibrant-ethan-test-org/argo-poc-app
  newTag: v0.1.4
- name: ghcr.io/vibrant-ethan-test-org/argo-poc-e2e
  newTag: v0.1.4
commonAnnotations:
  argo-poc/app-sha: d3544d55ffc8405ed35476b069c20d65c99b1bcc
patches:
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30081
  target:
    kind: Service
    name: app-active
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30082
  target:
    kind: Service
    name: app-preview
