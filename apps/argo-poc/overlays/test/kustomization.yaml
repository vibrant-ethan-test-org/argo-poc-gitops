# test environment. The image tags and app-sha below are what CI and promotion change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-poc-test
resources:
- ../../base
images:
- name: ghcr.io/vibrant-ethan-test-org/argo-poc-app
  newTag: v0.1.7
- name: ghcr.io/vibrant-ethan-test-org/argo-poc-e2e
  newTag: v0.1.7
commonAnnotations:
  argo-poc/app-sha: 8dd4a9f6912330509dbe106c59ce6243db6ab8d4
patches:
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30081
  target:
    kind: Service
    name: app-active
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30082
  target:
    kind: Service
    name: app-preview
