# test environment. The image tags and app-sha below are what CI and promotion change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-poc-test
resources:
- ../../base
images:
- name: ghcr.io/vibrant-ethan-test-org/argo-poc-app
  newTag: v0.1.11
- name: ghcr.io/vibrant-ethan-test-org/argo-poc-e2e
  newTag: v0.1.11
commonAnnotations:
  argo-poc/app-sha: 63982a4efad2e36715d46ca30349c2220c0d2c8f
patches:
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30081
  target:
    kind: Service
    name: app-active
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30082
  target:
    kind: Service
    name: app-preview
