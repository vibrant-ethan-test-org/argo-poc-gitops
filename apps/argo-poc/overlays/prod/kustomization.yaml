# prod environment. The image tags and app-sha below are what CI and promotion change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-prod
resources:
- ../../base
images:
- name: ghcr.io/vibrant-ethan-test-org/argo-poc-app
  newTag: v0.1.1
- name: ghcr.io/vibrant-ethan-test-org/argo-poc-e2e
  newTag: v0.1.1
commonAnnotations:
  argo-poc/app-sha: a02944e8ebd9f13c927454d96be3c59a751f7430
patches:
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30091
  target:
    kind: Service
    name: app-active
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30092
  target:
    kind: Service
    name: app-preview
