# prod environment. The image tags and app-sha below are what CI and promotion change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-poc-prod
resources:
- ../../base
images:
- name: ghcr.io/vibrant-ethan-test-org/argo-poc-app
  newTag: v0.1.9
- name: ghcr.io/vibrant-ethan-test-org/argo-poc-e2e
  newTag: v0.1.9
commonAnnotations:
  argo-poc/app-sha: d5d8ff26f3e2316a0ab4a2035d76943b2b8cfacc
patches:
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30091
  target:
    kind: Service
    name: app-active
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30092
  target:
    kind: Service
    name: app-preview
