# prod environment. The image tags and app-sha below are what CI and promotion change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-poc-prod
resources:
- ../../base
images:
- name: ghcr.io/vibrant-ethan-test-org/argo-poc-app
  newTag: v0.1.13
- name: ghcr.io/vibrant-ethan-test-org/argo-poc-e2e
  newTag: v0.1.13
commonAnnotations:
  argo-poc/app-sha: 807addd9d0a2c6651fee7d89eed42efc81caf80a
patches:
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30091
  target:
    kind: Service
    name: app-active
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30092
  target:
    kind: Service
    name: app-preview
