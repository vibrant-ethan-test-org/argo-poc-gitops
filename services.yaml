# Services deployed from this repo. on-deployed.yaml uses this to find each service's
# app repo (for GitHub Deployments), its main image, and its URLs.
# Adding a service: add an entry here and a folder under apps/<service>/.
argo-poc:
  repo: vibrant-ethan-test-org/argo-poc-app
  image: ghcr.io/vibrant-ethan-test-org/argo-poc-app
  urls: { test: "http://localhost:8081", prod: "http://localhost:8091" }
argo-poc-api:
  repo: vibrant-ethan-test-org/argo-poc-api
  image: ghcr.io/vibrant-ethan-test-org/argo-poc-api
  urls: { test: "http://localhost:8181", prod: "http://localhost:8191" }
