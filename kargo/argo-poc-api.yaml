# Kargo pipeline for argo-poc-api: Warehouse (new images in GHCR) -> Stage test (automatic) -> Stage prod
# (Promote button in the Kargo UI, only Freight verified in test).
apiVersion: v1
kind: Namespace
metadata:
  name: argo-poc-api
  labels:
    kargo.akuity.io/project: "true"   # lets the Project adopt this namespace
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: argo-poc-api
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: argo-poc-api
  namespace: argo-poc-api
spec:
  promotionPolicies:
    - stageSelector: { name: test }
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: images
  namespace: argo-poc-api
spec:
  interval: 30s
  subscriptions:
    - image:
        repoURL: ghcr.io/vibrant-ethan-test-org/argo-poc-api
        imageSelectionStrategy: SemVer
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: test
  namespace: argo-poc-api
spec:
  requestedFreight:
    - origin: { kind: Warehouse, name: images }
      sources: { direct: true }
  promotionTemplate:
    spec:
      steps:
        - task: { name: update-overlay, kind: ClusterPromotionTask }
          vars:
            - { name: service, value: argo-poc-api }
            - { name: image, value: ghcr.io/vibrant-ethan-test-org/argo-poc-api }
            - { name: e2eImage, value: ghcr.io/vibrant-ethan-test-org/argo-poc-api }  # /e2e in the same image
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: argo-poc-api
spec:
  requestedFreight:
    - origin: { kind: Warehouse, name: images }
      sources: { stages: [test] }
  promotionTemplate:
    spec:
      steps:
        - task: { name: update-overlay, kind: ClusterPromotionTask }
          vars:
            - { name: service, value: argo-poc-api }
            - { name: image, value: ghcr.io/vibrant-ethan-test-org/argo-poc-api }
            - { name: e2eImage, value: ghcr.io/vibrant-ethan-test-org/argo-poc-api }  # /e2e in the same image
