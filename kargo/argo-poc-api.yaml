# Kargo pipeline for argo-poc-api: Warehouse (new images in GHCR) -> Stage test (automatic) -> Stage prod
# (automatic once Freight is verified in test and has soaked there for 1 minute).
apiVersion: v1
kind: Namespace
metadata:
  name: argo-poc-api
  labels:
    kargo.akuity.io/project: "true"   # lets the Project adopt this namespace
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: argo-poc-api
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: argo-poc-api
  namespace: argo-poc-api
# Hold switch. These are only the starting values: after creation the Kargo UI owns them
# (Project Settings -> ProjectConfig, set autoPromotionEnabled to false to hold a Stage) and
# Argo CD ignores later differences (see argocd/kargo.yaml). Holding test also holds prod.
spec:
  promotionPolicies:
    - stageSelector: { name: test }
      autoPromotionEnabled: true
    - stageSelector: { name: prod }
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: images
  namespace: argo-poc-api
spec:
  interval: 30s
  subscriptions:
    - image:
        repoURL: ghcr.io/vibrant-ethan-test-org/argo-poc-api
        imageSelectionStrategy: SemVer
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: test
  namespace: argo-poc-api
spec:
  requestedFreight:
    - origin: { kind: Warehouse, name: images }
      sources: { direct: true }
  promotionTemplate:
    spec:
      steps:
        - task: { name: update-overlay, kind: ClusterPromotionTask }
          vars:
            - { name: service, value: argo-poc-api }
            - { name: image, value: ghcr.io/vibrant-ethan-test-org/argo-poc-api }
            - { name: e2eImage, value: ghcr.io/vibrant-ethan-test-org/argo-poc-api }  # /e2e in the same image
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: argo-poc-api
spec:
  requestedFreight:
    - origin: { kind: Warehouse, name: images }
      sources:
        stages: [test]
        requiredSoakTime: 1m   # time to spot a problem in test (and hold prod) before prod gets it
  promotionTemplate:
    spec:
      steps:
        - task: { name: update-overlay, kind: ClusterPromotionTask }
          vars:
            - { name: service, value: argo-poc-api }
            - { name: image, value: ghcr.io/vibrant-ethan-test-org/argo-poc-api }
            - { name: e2eImage, value: ghcr.io/vibrant-ethan-test-org/argo-poc-api }  # /e2e in the same image
