# Management (hub) cluster: runs only Argo CD, which deploys to the test and prod clusters.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: argo-mgmt
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30443, hostPort: 8443, listenAddress: 127.0.0.1 } # Argo CD UI, this Mac only (admin/admin)
