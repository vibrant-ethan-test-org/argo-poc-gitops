# Test cluster: Argo Rollouts plus every service's test namespace. Deployed to by Argo CD in argo-mgmt.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: argo-test
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30081, hostPort: 8081 } # argo-poc active
      - { containerPort: 30082, hostPort: 8082 } # argo-poc preview
      - { containerPort: 30181, hostPort: 8181 } # argo-poc-api active
      - { containerPort: 30182, hostPort: 8182 } # argo-poc-api preview
