# Single-node kind cluster for the Argo CD + Argo Rollouts PoC.
# NodePorts are mapped to fixed localhost ports so URLs stay stable.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: argo-poc
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30443, hostPort: 8443 } # Argo CD UI
      - { containerPort: 30081, hostPort: 8081 } # argo-poc test active
      - { containerPort: 30082, hostPort: 8082 } # argo-poc test preview
      - { containerPort: 30091, hostPort: 8091 } # argo-poc prod active
      - { containerPort: 30092, hostPort: 8092 } # argo-poc prod preview
      - { containerPort: 30181, hostPort: 8181 } # argo-poc-api test active
      - { containerPort: 30182, hostPort: 8182 } # argo-poc-api test preview
      - { containerPort: 30191, hostPort: 8191 } # argo-poc-api prod active
      - { containerPort: 30192, hostPort: 8192 } # argo-poc-api prod preview
