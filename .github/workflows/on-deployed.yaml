# Runs when Argo CD reports that <service>-<env> is deployed and Healthy.
# 1. Records a GitHub Deployment on the app commit in the service's own repo.
# 2. After a test deploy, opens a PR that promotes exactly what passed test to prod.
# Every step is idempotent, since Argo CD may report the same deploy more than once.
name: on-deployed

on:
  repository_dispatch:
    types: [app-deployed]

# One group per app: different apps run in parallel. GitHub keeps only one waiting run per group,
# so a single shared group would cancel events when several apps report at once.
concurrency:
  group: on-deployed-${{ github.event.client_payload.app }}
  cancel-in-progress: false

env:
  APP: ${{ github.event.client_payload.app }}
  REVISION: ${{ github.event.client_payload.revision }}
  GH_TOKEN: ${{ secrets.POC_PAT }}

jobs:
  deployed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.POC_PAT }}

      - name: Read deployed version
        id: v
        run: |
          if ! [[ "$APP" =~ ^([a-z0-9-]+)-(test|prod)$ ]]; then echo "::error::Unexpected app name '$APP'"; exit 1; fi
          service=${BASH_REMATCH[1]}; env=${BASH_REMATCH[2]}
          if ! [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::Bad revision '$REVISION'"; exit 1; fi
          repo=$(yq ".[\"$service\"].repo // \"\"" services.yaml)
          [ -n "$repo" ] || { echo "::error::Service '$service' is not in services.yaml"; exit 1; }
          image=$(yq ".[\"$service\"].image" services.yaml)
          url=$(yq ".[\"$service\"].urls.$env" services.yaml)
          git show "$REVISION:apps/$service/overlays/$env/kustomization.yaml" > "$RUNNER_TEMP/deployed.yaml"
          tag=$(yq ".images[] | select(.name == \"$image\") | .newTag" "$RUNNER_TEMP/deployed.yaml")
          sha=$(yq '.commonAnnotations["argo-poc/app-sha"]' "$RUNNER_TEMP/deployed.yaml")
          echo "$APP at gitops $REVISION runs $tag ($repo@$sha)"
          { echo "service=$service"; echo "env=$env"; echo "repo=$repo"; echo "image=$image"
            echo "url=$url"; echo "tag=$tag"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"

      - name: Record GitHub Deployment on the app commit
        if: steps.v.outputs.sha != 'unset'
        env:
          ENV: ${{ steps.v.outputs.env }}
          REPO: ${{ steps.v.outputs.repo }}
          URL: ${{ steps.v.outputs.url }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          last=$(gh api "repos/$REPO/deployments?environment=$ENV&per_page=1" --jq '.[0].payload.tag // ""')
          if [ "$last" = "$TAG" ]; then echo "$ENV already recorded at $TAG"; exit 0; fi
          id=$(jq -n --arg ref "$SHA" --arg env "$ENV" --arg tag "$TAG" '{
                ref: $ref, environment: $env, description: $tag, auto_merge: false,
                required_contexts: [], payload: {tag: $tag},
                production_environment: ($env == "prod")}' \
               | gh api "repos/$REPO/deployments" --input - --jq .id)
          gh api "repos/$REPO/deployments/$id/statuses" \
            -f state=success -f environment_url="$URL" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$REVISION" \
            -f description="Argo CD: $APP Healthy at $TAG" --silent
          echo "Recorded $ENV deployment $id for $REPO $TAG"

      - name: Open prod promotion PR
        if: steps.v.outputs.env == 'test' && steps.v.outputs.sha != 'unset'
        env:
          SERVICE: ${{ steps.v.outputs.service }}
          REPO: ${{ steps.v.outputs.repo }}
          IMAGE: ${{ steps.v.outputs.image }}
          TAG: ${{ steps.v.outputs.tag }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          prod="apps/$SERVICE/overlays/prod/kustomization.yaml"
          prod_tag=$(yq ".images[] | select(.name == \"$IMAGE\") | .newTag" "$prod")
          prod_sha=$(yq '.commonAnnotations["argo-poc/app-sha"]' "$prod")
          if [ "$prod_tag" = "$TAG" ]; then echo "prod already runs $TAG"; exit 0; fi
          branch="promote/$SERVICE/prod-$TAG"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "PR for $SERVICE $TAG already open"; exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # Copy exactly what passed test: every image tag and the app commit.
          (cd "apps/$SERVICE/overlays/prod" &&
            for ref in $(yq '.images[] | .name + ":" + .newTag' "$RUNNER_TEMP/deployed.yaml"); do
              kustomize edit set image "$ref"
            done &&
            kustomize edit add annotation "argo-poc/app-sha:$SHA" --force)
          git commit -am "$SERVICE prod: $TAG ($REPO@$SHA)"
          git push -f origin "$branch"

          if [ "$prod_sha" = unset ]; then
            changes="- First promotion to prod"
          else
            changes=$(gh api "repos/$REPO/compare/$prod_sha...$SHA" \
              --jq '.commits | reverse | .[] | "- \(.sha[0:7]) \(.commit.message | split("\n")[0]) (\(.commit.author.name))"')
          fi
          body=$(printf '%s\n' \
            "Promotes **$SERVICE $TAG** to prod. It passed blue-green and e2e in test." \
            "" \
            "| | Tag | App commit |" \
            "|---|---|---|" \
            "| prod now | \`$prod_tag\` | $REPO@$prod_sha |" \
            "| prod after merge | \`$TAG\` | $REPO@$SHA |" \
            "" \
            "### App changes" \
            "$changes" \
            "" \
            "Merging lets Argo CD sync $SERVICE-prod, which runs blue-green with e2e again before switching traffic.")
          gh pr create --base main --head "$branch" --title "$SERVICE prod: $TAG" --body "$body"

          # Close older promotion PRs for this service that this one supersedes.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"promote/$SERVICE/prod-\")) | select(.headRefName != \"$branch\") | .number" |
          while read -r n; do gh pr close "$n" --delete-branch --comment "Superseded by $TAG."; done
