# Shared release workflow, called by each app repo's ci.yaml:
#   uses: vibrant-ethan-test-org/argo-poc-gitops/.github/workflows/release.yaml@main
# Builds the service's images and pushes them to GHCR. That is all CI does: Kargo notices the
# new tag (Warehouse), deploys it to test, and offers it for prod once test is verified.
# The commit is recorded as an index annotation, which Kargo reads for the e2e version check.
name: release

on:
  workflow_call:
    inputs:
      service:
        description: Service name (Kargo Project); kept so callers need no change
        type: string
        required: true
      images:
        description: 'JSON list of {"image", "context", "file"} to build; all get the same tag'
        type: string
        required: true

env:
  REGISTRY: ghcr.io/vibrant-ethan-test-org
  VERSION: v0.1.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
