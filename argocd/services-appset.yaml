# One Argo CD Application per service per environment, from the folders in apps/:
#   apps/<service>/overlays/<env>  ->  Application <service>-<env> in namespace <service>-<env>
# Adding a service or environment is just adding a folder.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/vibrant-ethan-test-org/argo-poc-gitops.git
        revision: main
        directories:
          - path: apps/*/overlays/*
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-{{ .path.basename }}'
      labels:
        argo-poc/service: '{{ index .path.segments 1 }}'
        argo-poc/env: '{{ .path.basename }}'
      annotations:
        # Tell GitHub when this app is deployed (see notifications-cm.yaml).
        notifications.argoproj.io/subscribe.on-deployed.gh-dispatch: ""
        # Only re-render when this service's folder (base + overlays) changes.
        argocd.argoproj.io/manifest-generate-paths: ../..
    spec:
      project: argo-poc
      source:
        repoURL: https://github.com/vibrant-ethan-test-org/argo-poc-gitops.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 1 }}-{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
