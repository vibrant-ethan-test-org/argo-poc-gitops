# One Argo CD Application per service per environment, from the folders in apps/:
#   apps/<service>/overlays/<env>  ->  Application <service>-<env>,
#                                      namespace <service>-<env> on the cluster named <env>
# Clusters "test" and "prod" are registered by bootstrap/install.sh.
# Adding a service is just adding a folder; adding an environment also needs a cluster with that name.
# Kargo promotes into these apps (see kargo/): it commits to main, then pins the app's
# targetRevision to that commit, which this ApplicationSet must not undo.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  ignoreApplicationDifferences:
    - jsonPointers: [/spec/source/targetRevision]
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/vibrant-ethan-test-org/argo-poc-gitops.git
        revision: main
        directories:
          - path: apps/*/overlays/*
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-{{ .path.basename }}'
      labels:
        argo-poc/service: '{{ index .path.segments 1 }}'
        argo-poc/env: '{{ .path.basename }}'
      annotations:
        # Kargo Stage <service>:<env> may update this app.
        kargo.akuity.io/authorized-stage: '{{ index .path.segments 1 }}:{{ .path.basename }}'
        # Only re-render when this service's folder (base + overlays) or the shared base changes.
        argocd.argoproj.io/manifest-generate-paths: ../..;/bases/bluegreen-service
    spec:
      project: argo-poc
      source:
        repoURL: https://github.com/vibrant-ethan-test-org/argo-poc-gitops.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        name: '{{ .path.basename }}'   # overlays/test -> cluster "test", overlays/prod -> cluster "prod"
        namespace: '{{ index .path.segments 1 }}-{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
