# One Argo CD Application per service per environment, from the folders in apps/:
#   apps/<service>/overlays/<env>  ->  Application <service>-<env>,
#                                      namespace <service>-<env> on the cluster named <env>
# Clusters "test" and "prod" are registered by bootstrap/install.sh.
# Adding a service is just adding a folder; adding an environment also needs a cluster with that name.
#
# Guards against a bad edit to this file (e.g. a glob that stops matching) wiping the apps:
# - Prune=false: root never deletes this ApplicationSet, even if the file is removed or renamed.
# - applicationsSync create-update: this ApplicationSet creates and updates apps but never deletes
#   them, so removing a service is deliberate (delete the folder, then delete the app by hand).
#   Needs applicationsetcontroller.enable.policy.override=true (set in bootstrap/install.sh).
# - preserveResourcesOnDeletion: deleting an app leaves its Rollout and Services running.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/vibrant-ethan-test-org/argo-poc-gitops.git
        revision: main
        directories:
          - path: apps/*/overlays/*
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-{{ .path.basename }}'
      labels:
        argo-poc/service: '{{ index .path.segments 1 }}'
        argo-poc/env: '{{ .path.basename }}'
      annotations:
        # Tell GitHub when this app is deployed (see notifications-cm.yaml).
        notifications.argoproj.io/subscribe.on-deployed.gh-dispatch: ""
        # Only re-render when this service's folder (base + overlays) changes.
        argocd.argoproj.io/manifest-generate-paths: ../..
    spec:
      project: argo-poc
      source:
        repoURL: https://github.com/vibrant-ethan-test-org/argo-poc-gitops.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        name: '{{ .path.basename }}'   # overlays/test -> cluster "test", overlays/prod -> cluster "prod"
        namespace: '{{ index .path.segments 1 }}-{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
