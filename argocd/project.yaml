# Limits the PoC apps to this repo, the test and prod clusters, and argo-poc* namespaces.
# Nothing in this project can deploy to the management cluster that runs Argo CD itself.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argo-poc
  namespace: argocd
spec:
  description: Argo CD + Argo Rollouts PoC
  sourceRepos:
    - https://github.com/vibrant-ethan-test-org/argo-poc-gitops.git
  destinations:
    - name: test
      namespace: argo-poc*
    - name: prod
      namespace: argo-poc*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Prod freeze / time windows: add Argo CD sync windows here, e.g.
  #   syncWindows:
  #     - kind: deny
  #       description: "hold: <reason>"
  #       schedule: "* * * * *"   # with duration 1h this is always active (an ad-hoc freeze)
  #       duration: 1h
  #       applications: ["*-prod"]
  #       manualSync: true        # Kargo Promote by a person still goes through
  # Kargo commits during a deny window, then its argocd-update step waits (up to 72h) for Argo CD.
