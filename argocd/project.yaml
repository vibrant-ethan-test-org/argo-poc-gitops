# Limits the PoC apps to this repo and argo-poc* namespaces.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argo-poc
  namespace: argocd
spec:
  description: Argo CD + Argo Rollouts PoC
  sourceRepos:
    - https://github.com/vibrant-ethan-test-org/argo-poc-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argo-poc*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
