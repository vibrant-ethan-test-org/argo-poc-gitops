# Limits the PoC apps to this repo, the test and prod clusters, and argo-poc* namespaces.
# Nothing in this project can deploy to the management cluster that runs Argo CD itself.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argo-poc
  namespace: argocd
spec:
  description: Argo CD + Argo Rollouts PoC
  sourceRepos:
    - https://github.com/vibrant-ethan-test-org/argo-poc-gitops.git
  destinations:
    - name: test
      namespace: argo-poc*
    - name: prod
      namespace: argo-poc*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Deploy windows, per app (<service>-<env>; use exact names: "argo-poc-*" would also match argo-poc-api-*).
  # Outside a window Kargo still commits, then its argocd-update step waits (up to 72h) for Argo CD.
  # manualSync: true lets a person's Promote in the Kargo UI through; auto-promotions wait.
  syncWindows:
    # Web app prod deploys only on weekdays 9:00-17:00 Eastern. argo-poc-api-prod has no window.
    - kind: allow
      description: "argo-poc prod: weekdays 9-5 ET"
      schedule: "0 9 * * 1-5"
      duration: 8h
      timeZone: America/New_York
      applications: ["argo-poc-prod"]
      manualSync: true
    # Ad-hoc freeze example (always active while present):
    # - kind: deny
    #   description: "hold: <reason>"
    #   schedule: "* * * * *"
    #   duration: 1h
    #   applications: ["argo-poc-prod"]
    #   manualSync: true
