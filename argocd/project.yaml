# Limits the PoC apps to this repo, the test and prod clusters, and argo-poc* namespaces.
# Nothing in this project can deploy to the management cluster that runs Argo CD itself.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argo-poc
  namespace: argocd
spec:
  description: Argo CD + Argo Rollouts PoC
  sourceRepos:
    - https://github.com/vibrant-ethan-test-org/argo-poc-gitops.git
  destinations:
    - name: test
      namespace: argo-poc*
    - name: prod
      namespace: argo-poc*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Prod freeze / time windows. Kargo still commits promotions during a deny window, then its
  # argocd-update step waits (up to 72h) for Argo CD to be allowed to sync. manualSync: true lets a
  # person's Promote in the Kargo UI through; auto-promotions wait.
  syncWindows:
    - kind: deny
      description: "hold: sync-window test"
      schedule: "* * * * *"   # starts every minute and lasts an hour, so always active
      duration: 1h
      applications: ["*-prod"]
      manualSync: true
