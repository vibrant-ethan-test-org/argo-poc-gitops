# Kargo pipelines (kargo/): Projects, Warehouses, Stages and the shared promotion task.
# Kargo itself is installed by bootstrap/install.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-pipelines
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vibrant-ethan-test-org/argo-poc-gitops.git
    targetRevision: main
    path: kargo
  destination:
    server: https://kubernetes.default.svc
  # Auto-promotion switches are changed in the Kargo UI, so Git only sets their starting values.
  ignoreDifferences:
    - group: kargo.akuity.io
      kind: ProjectConfig
      jsonPointers: [/spec/promotionPolicies]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
